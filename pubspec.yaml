name: flutter_ytdlp
description: "Standalone URL video/audio downloader extracted from Muzicz."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
